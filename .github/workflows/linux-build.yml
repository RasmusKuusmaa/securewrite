name: Linux desktop build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (deb + AppImage)
        run: npm run tauri build -- --bundles deb,appimage

      - name: Verify the release binary actually launches
        run: |
          sudo apt-get install -y -qq xvfb
          BIN="$(find src-tauri/target/release -maxdepth 1 -type f -executable -name 'secure-write')"
          xvfb-run -a --server-args='-screen 0 1024x768x24' timeout 10 "$BIN" &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "binary exited before the 10s timeout - treating as a launch failure"
            wait "$APP_PID"
            exit 1
          fi
          echo "binary is still running 5s after launch - OK"
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
